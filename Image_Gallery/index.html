<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <!-- Filter Buttons -->
    <div class="filters">
        <button onclick="filterSelection('all')">All</button>
        <button onclick="filterSelection('nature')">Nature</button>
        <button onclick="filterSelection('city')">City</button>
        <button onclick="filterSelection('animals')">Animals</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="image nature">
            <img src="https://picsum.photos/id/1015/400/300" alt="Nature">
        </div>

        <div class="image city">
            <img src="https://picsum.photos/id/1011/400/300" alt="City">
        </div>

        <div class="image animals">
            <img src="https://picsum.photos/id/1025/400/300" alt="Animal">
        </div>

        <div class="image nature">
            <img src="https://picsum.photos/id/1039/400/300" alt="Nature">
        </div>

        <div class="image city">
            <img src="https://picsum.photos/id/1043/400/300" alt="City">
        </div>

        <div class="image animals">
            <img src="https://picsum.photos/id/1062/400/300" alt="Animal">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox">
        <span id="close">&times;</span>
        <img id="lightbox-img">
    </div>

    <script src="script.js"></script>

</body>
</html>
